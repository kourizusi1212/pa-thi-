<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>ポップアップ・パーティー 3D</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap">
<style>
:root{--ink:#2b1d4a;--paper:#fff7e0;--pink:#ff4f8b;--sun:#ffc93c;--mint:#2ee6a6}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:'M PLUS Rounded 1c',system-ui,sans-serif;color:var(--ink);touch-action:none}
canvas{display:block}
.ui{position:fixed;pointer-events:none;inset:0}
.pop{pointer-events:auto;background:var(--paper);border:4px solid var(--ink);border-radius:20px;box-shadow:6px 6px 0 var(--ink)}
h1,h2{font-family:'Dela Gothic One',sans-serif;margin:0;font-weight:400}
#join{position:fixed;inset:0;display:grid;place-items:center;background:rgba(43,29,74,.55)}
#join .pop{padding:28px;width:min(92vw,380px);text-align:center}
#join h1{font-size:30px;line-height:1.15;color:var(--pink);text-shadow:3px 3px 0 var(--ink);-webkit-text-stroke:1px var(--ink)}
input{width:100%;font:inherit;font-weight:800;padding:12px;margin-top:12px;border:3px solid var(--ink);border-radius:12px;background:#fff}
button{font:inherit;font-weight:800;font-size:18px;padding:12px 22px;margin-top:14px;border:3px solid var(--ink);border-radius:14px;background:var(--sun);color:var(--ink);box-shadow:0 5px 0 var(--ink);cursor:pointer}
button:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
button:focus-visible,input:focus-visible{outline:4px solid var(--pink);outline-offset:2px}
#hud{top:10px;left:50%;transform:translateX(-50%);position:absolute;text-align:center;padding:6px 18px;display:none}
#hud b{font-family:'Dela Gothic One';font-size:22px}
#board{position:absolute;left:10px;top:10px;padding:8px 12px;min-width:150px;font-size:14px;font-weight:800}
#board div{display:flex;gap:8px;align-items:center;margin:3px 0}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);flex:none}
#banner{position:absolute;left:0;right:0;top:28%;text-align:center;font-family:'Dela Gothic One';font-size:clamp(34px,8vw,80px);color:#fff;-webkit-text-stroke:3px var(--ink);paint-order:stroke fill;text-shadow:6px 6px 0 var(--ink);white-space:pre-line;line-height:1.2}
#lobby{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);padding:16px 22px;text-align:center;width:min(92vw,420px)}
#lobby p{margin:6px 0;font-size:14px}
#result{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:18px 24px;width:min(92vw,420px);display:none}
#result div{display:flex;gap:8px;align-items:center;margin:6px 0;font-weight:800}
#result span.n{flex:1}
.hide{display:none!important}
@media(prefers-reduced-motion:no-preference){#banner{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(1.5);opacity:0}}}
</style>
</head>
<body>
<div class="ui">
  <div id="board" class="pop"></div>
  <div id="hud" class="pop"><div id="gname"></div><b id="timer"></b></div>
  <div id="banner"></div>
  <div id="lobby" class="pop"><h2>ロビー</h2><p id="lobbyinfo"></p><p id="share" style="word-break:break-all"></p><button id="start">ゲームスタート</button></div>
  <div id="result" class="pop"></div>
</div>
<div id="join"><div class="pop">
  <h1>ポップアップ<br>パーティー 3D</h1>
  <input id="name" maxlength="12" placeholder="なまえ" autocomplete="off">
  <input id="room" maxlength="16" placeholder="ルーム名(友だちと同じ名前)">
  <button id="go">あそぶ!</button>
  <p style="font-size:13px;margin:12px 0 0">移動: WASD / 矢印キー / 画面ドラッグ</p>
</div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module" src="game.js"></script>
</body>
</html>
